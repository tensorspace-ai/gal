name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. `macos-latest` is a moving alias that has pointed
        # at Intel in the past, and the `-large` variants are Intel today, so the
        # runner is pinned rather than left to drift. Avoid `macos-13` and any
        # `macos-*-large`: those are x86_64, and we have no Intel hardware to
        # reproduce a failure on.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The browser client ships its own OT engine; it must agree with Rust's
      # exactly. tests/vectors.json is a checked-in golden file that both engines
      # are replayed against — `cargo test` covers the Rust half. It is
      # deliberately not regenerated here: doing so let a change to the Rust
      # engine rewrite its own expectations and still pass.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ot.test.js
      # Browser tests need a real Chromium; playwright-core does not fetch one.
      - run: npm install --prefix tests
      - run: npx --yes playwright install --with-deps chromium
      - run: cargo build --release -p gal-server
      - run: node tests/browser.mjs

  # Everything above runs in the dev profile. What ships is built with lto and
  # codegen-units = 1, and nothing was checking that the optimised build behaves
  # the same. Kept out of run-tests.sh so the local loop stays fast; CI has the
  # time and runs it alongside the rest.
  release:
    name: the optimised build behaves the same
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      # --all-targets, so tests and examples are held to the MSRV too; plain
      # `cargo check` covers neither, and both are part of the build.
      - run: cargo check --workspace --all-targets --locked

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Advisories are one question; what a shipped binary is allowed to carry is
  # another. An explicit licence allow-list, and no source but crates.io.
  deny:
    name: licences and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # The Dockerfile is only built by the release, so a change that breaks it
  # would otherwise surface at the worst possible moment.
  docker:
    name: the image still builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
