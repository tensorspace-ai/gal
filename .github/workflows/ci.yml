name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. `macos-latest` is a moving alias that has pointed
        # at Intel in the past, and the `-large` variants are Intel today, so the
        # runner is pinned rather than left to drift. Avoid `macos-13` and any
        # `macos-*-large`: those are x86_64, and we have no Intel hardware to
        # reproduce a failure on.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The browser client ships its own OT engine; it must agree with Rust's
      # exactly, so the conformance vectors are regenerated and replayed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo run -q -p gal-ot --example gen_vectors > tests/vectors.json
      - run: node tests/ot.test.js
      # Browser tests need a real Chromium; playwright-core does not fetch one.
      - run: npm install --prefix tests
      - run: npx --yes playwright install --with-deps chromium
      - run: cargo build --release -p gal-server
      - run: node tests/browser.mjs

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
