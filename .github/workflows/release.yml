name: Release

# Tag-driven: `git tag v0.2.0 && git push --tags`. The tag is the only input,
# and the job refuses one that disagrees with Cargo.toml rather than shipping a
# version nobody asked for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.2.0
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: the tag matches the manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$manifest" ]; then
            echo "tag $tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # --locked: a release must build the dependency versions that were tested,
      # not whatever resolved on the day.
      - run: cargo build --release --locked --target ${{ matrix.target }} -p gal-server

      - name: Package
        shell: bash
        run: |
          version="${{ needs.check.outputs.version }}"
          name="gal-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/gal-server" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-NOTICES.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      # Prefixed, so the download below can ask for the archives by name. The
      # `image` job's buildx metadata lands in the same artifact namespace and
      # must not be mistaken for a release file.
      - uses: actions/upload-artifact@v7
        with:
          name: gal-${{ matrix.target }}
          path: dist/*

  image:
    name: container image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile is otherwise built by nothing, so it can rot unnoticed
      # between releases.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.check.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: publish the release
    needs: [check, build, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `pattern` is not optional. Without it this downloads *every* artifact
      # the run produced, which includes the `.dockerbuild` blob that
      # `docker/build-push-action` uploads as a build summary. That blob is not
      # a release file, it would land in `dist/` and be published and hashed as
      # if it were, and on the first release that ever ran here its download
      # failed after five retries and took the whole job with it.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: gal-*
          merge-multiple: true
      # One file, so `sha256sum -c SHA256SUMS` verifies the whole release.
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: CHANGELOG.md
          draft: true
          fail_on_unmatched_files: true

  # Deliberately last, and deliberately separate: crates.io cannot be undone, so
  # it runs only once the binaries exist. The dependency order is gal-ot, then
  # gal-core, then the server.
  crates-io:
    name: publish to crates.io
    needs: [check, release]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # One invocation rather than three. Cargo publishes in dependency order
      # itself and waits for each crate to appear in the index before building
      # the next; three separate commands race that propagation, and the loser
      # fails having already spent two of the three version numbers.
      - run: cargo publish --locked -p gal-ot -p gal-core -p gal-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
