[workspace]
resolver = "2"
members = ["crates/gal-ot", "crates/gal-core", "crates/gal-server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
authors = ["TensorSpace, Inc."]
repository = "https://github.com/tensorspace-ai/gal"
homepage = "https://github.com/tensorspace-ai/gal"
# crates.io rejects a keyword of 20 characters or more, and enforces it only on
# upload — `cargo publish --dry-run` never contacts the registry, so this passes
# every local check and fails the real one. "operational-transformation" is 26
# and cost a release. The full term still appears in each crate's description,
# which crates.io also searches.
keywords = ["collaboration", "concurrent-editing", "realtime", "websocket", "wave"]
categories = ["web-programming::websocket", "text-editors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Deliberately *not* `panic = "abort"`. This is a server holding many people's
# live connections in one process, and the code is written to contain a failure
# rather than escalate it: the connection task catches a panicking command, the
# wave it touched is evicted and reloaded from storage, and the client
# reconnects and resynchronises. Aborting turned a bug in one edit, in one wave,
# into an outage for everyone on the box — and it silently made the JoinError
# arms around the password-hashing and database pools unreachable, so that code
# claimed to handle something it could never see.
