[workspace]
resolver = "2"
members = ["crates/gal-ot", "crates/gal-core", "crates/gal-server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
authors = ["TensorSpace, Inc."]
repository = "https://github.com/tensorspace-ai/gal"
homepage = "https://github.com/tensorspace-ai/gal"
keywords = ["collaboration", "operational-transformation", "realtime", "websocket", "wave"]
categories = ["web-programming::websocket", "text-editors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
