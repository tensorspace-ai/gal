[package]
name = "gal-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Gal — an Apache Wave-style real-time collaboration server"
# An application rather than a library, but published all the same so it can be
# installed with `cargo install gal-server`. It depends on both library crates,
# so the release order is gal-ot, then gal-core, then this.
publish = true
# The end-to-end suite drives a real server over real sockets: it belongs to the
# repository, not to what anyone installs. `mod e2e` is #[cfg(test)], so leaving
# the file out still builds — at the cost that `cargo test` inside an unpacked
# .crate cannot find the module. Run the suite from a checkout instead.
exclude = ["src/e2e.rs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["compression-gzip", "trace", "set-header", "timeout"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
argon2 = "0.5"
password-hash = { version = "0.6", features = ["rand_core"] }
rand = "0.10"
base64 = "0.23"
sha2 = "0.11"
dashmap = "6"
futures = "0.3"
# Only for the OpenID Connect flow, which talks to a provider over TLS.
# `rustls-tls-native-roots` rather than the webpki bundle: it trusts the same
# certificates the rest of the host does, so an internal provider behind a
# private CA works without a second trust store to maintain — and it keeps a
# Mozilla CA bundle, whose licence is not on `deny.toml`'s list, out of the
# tree. rustls rather than the platform library because this project already
# compiles C for the bundled SQLite and rustls needs no more than that.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
gal-core = { path = "../gal-core", version = "0.2.0" }
gal-ot = { path = "../gal-ot", version = "0.2.0" }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.30"
